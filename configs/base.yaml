# Data splits
data:
  train_folds: [1, 2, 3, 4]
  test_folds: [5]

# Text vectorization
vectorizer:
  # one of: unigram, unigram_bigram
  variant: unigram
  lowercase: true
  stop_words: english
  min_df: 2
  max_features: null

# Model configurations and simple grids for tuning on folds 1–4
models:
  naive_bayes:
    alpha: [0.1, 0.5, 1.0]
    # Optional: select top-k most frequent features (applied after fitting vectorizer)
    top_k: [null, 5000, 10000]

  logistic_l1:
    C: [0.01, 0.1, 1.0, 10.0]
    solver: liblinear
    max_iter: 1000

  tree:
    ccp_alpha: [0.0, 0.001, 0.01]
    max_depth: [null, 10, 20]
    min_samples_leaf: [1, 2, 5]

  random_forest:
    n_estimators: [200, 500]
    max_features: [sqrt, log2]
    max_depth: [null, 20]
    oob_score: true
    n_jobs: -1

  gradient_boosting:
    library: sklearn  # or xgboost
    learning_rate: [0.05, 0.1]
    n_estimators: [200, 500]
    max_depth: [2, 3]

# Cross-validation settings (used on training folds only)
cv:
  n_splits: 5
  shuffle: true
  random_state: 42

# Evaluation settings for test fold
evaluation:
  metrics: [accuracy, precision, recall, f1]
  average: binary

# Reproducibility
seed: 42

# Output paths
output:
  base_dir: results
  metrics_dir: results/metrics
  predictions_dir: results/predictions
  models_dir: results/models
  figures_dir: results/figures
  logs_dir: results/logs

